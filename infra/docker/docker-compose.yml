version: "3.9"

x-common-env: &common-env
  DATABASE_URL:             ${DATABASE_URL}
  KAFKA_BOOTSTRAP_SERVERS:  ${KAFKA_BOOTSTRAP_SERVERS}
  KAFKA_TOPIC_RAW:          ${KAFKA_TOPIC_RAW}
  KAFKA_TOPIC_PROCESSED:    ${KAFKA_TOPIC_PROCESSED}
  MLFLOW_TRACKING_URI:      ${MLFLOW_TRACKING_URI}
  MLFLOW_EXPERIMENT:        ${MLFLOW_EXPERIMENT}
  SPARK_MASTER:             ${SPARK_MASTER}
  PG_JDBC_URL:              ${PG_JDBC_URL}
  POSTGRES_USER:            ${POSTGRES_USER}
  POSTGRES_PASSWORD:        ${POSTGRES_PASSWORD}

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Zookeeper (Kafka dependency) ────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  # ── Kafka ───────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:                zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS:             PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:   PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:       PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── MLflow Tracking Server ──────────────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MLFLOW_ARTIFACT_ROOT:     /mlflow/artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    command: >
      bash -c "pip install -q mlflow psycopg2-binary &&
               mlflow server
                 --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
                 --default-artifact-root /mlflow/artifacts
                 --host 0.0.0.0
                 --port 5000"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Spark Master ────────────────────────────────────────────────────────
  spark-master:
    image: bitnami/spark:3.5
    restart: unless-stopped
    environment:
      SPARK_MODE:               master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED:     "no"
    volumes:
      - spark_logs:/opt/bitnami/spark/logs
    ports:
      - "8080:8080"   # Spark Web UI
      - "7077:7077"   # Spark master port

  # ── Spark Worker ────────────────────────────────────────────────────────
  spark-worker:
    image: bitnami/spark:3.5
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      SPARK_MODE:              worker
      SPARK_MASTER_URL:        spark://spark-master:7077
      SPARK_WORKER_MEMORY:     2G
      SPARK_WORKER_CORES:      2
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED:     "no"
    volumes:
      - spark_logs:/opt/bitnami/spark/logs

  # ── FastAPI (Anomaly Detection API) ─────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - model_artifacts:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka Ingestion Consumer ─────────────────────────────────────────────
  ingestion-consumer:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.ingestion
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
    command: python -m services.ingestion.consumer

  # ── Airflow ──────────────────────────────────────────────────────────────
  airflow-init:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__EXECUTOR:             LocalExecutor
      AIRFLOW__CORE__FERNET_KEY:           ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY:      ${AIRFLOW__WEBSERVER__SECRET_KEY}
      _AIRFLOW_DB_MIGRATE:                 "true"
      _AIRFLOW_WWW_USER_CREATE:            "true"
      _AIRFLOW_WWW_USER_USERNAME:          admin
      _AIRFLOW_WWW_USER_PASSWORD:          admin123
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
    command: version
    restart: "no"

  airflow-webserver:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.airflow
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__EXECUTOR:             LocalExecutor
      AIRFLOW__CORE__FERNET_KEY:           ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY:      ${AIRFLOW__WEBSERVER__SECRET_KEY}
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
    command: webserver
    ports:
      - "8081:8080"

  airflow-scheduler:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.airflow
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__EXECUTOR:             LocalExecutor
      AIRFLOW__CORE__FERNET_KEY:           ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY:      ${AIRFLOW__WEBSERVER__SECRET_KEY}
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
    command: scheduler

  # ── Prometheus ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ../grafana/provisioning/datasources/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"

  # ── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER:     ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  mlflow_artifacts:
  spark_logs:
  model_artifacts:
  prometheus_data:
  grafana_data:
