apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: weather-anomaly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: python:3.11-slim
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: weather-secrets
          command:
            - bash
            - -c
            - |
              pip install -q mlflow psycopg2-binary &&
              mlflow server \
                --backend-store-uri postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB) \
                --default-artifact-root /mlflow/artifacts \
                --host 0.0.0.0 --port 5000
          volumeMounts:
            - name: mlflow-artifacts
              mountPath: /mlflow/artifacts
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
      volumes:
        - name: mlflow-artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts-pvc
  namespace: weather-anomaly
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: weather-anomaly
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
